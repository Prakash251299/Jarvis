name: jarvis
description: A production-quality local AI voice assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  dio: ^5.7.0
  flutter_sound: ^9.2.13
  just_audio: ^0.9.40
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.3
  intl: ^0.19.0
  uuid: ^4.4.2
  path_provider: ^2.1.4
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
